# Image names are fixed in the chart. Registry values include any project path.
images:
  # Placeholder: set to the registry where you publish the required images.
  registry: registry.example.com/dune-awakening-images
  operators:
    version: v1.7.0
  game:
    version: 2162777-0-shipping
    # Must match the game build advertised to Funcom.
    revision: 2162777
  postgres:
    version: 17.4-alpine-fc-13
  yq:
    registry: docker.io
    version: "4.47.2"
  python:
    registry: docker.io
    version: 3.13-alpine
  pghero:
    registry: docker.io
    version: v2.8.3
  filebrowser:
    registry: docker.io
    version: v2.18.0

credentials:
  # Provision separately. Helm never creates or rotates database credentials.
  existingSecret: dune-credentials

# Optionally set node labels to restrict workload placement.
nodeSelector: {}

# Opt in after identifying trusted node IPs and verifying CNI enforcement.
# Game servers and the file browser use upstream hostNetwork pods.
networkPolicy:
  enabled: false
  # Required when enabled: narrow node /32 or /128 addresses are preferred.
  # Host-networked clients need these exceptions for internal connections.
  nodeCIDRs: []
  playerCIDRs: ["0.0.0.0/0", "::/0"]
  # API server traffic may be SNATed; narrow to its observed source addresses.
  apiServerCIDRs: ["0.0.0.0/0", "::/0"]
  game:
    port: 7777
    endPort: 7810
  monitoring:
    enabled: false
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector: {}
    # RabbitMQ Prometheus metrics. Add only the metrics ports you need.
    ports:
      - protocol: TCP
        port: 15692

storage:
  class: ""
  databaseSize: 20Gi
  sharedSize: 5Gi

# Operator-managed physical backups and a PVC-backed S3 destination.
backups:
  enabled: false
  # Always interpreted in UTC.
  schedule: "0 3 * * *"
  # Must contain AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY and carry the label
  # igw.funcom.com/backup-credentials: <this Secret name>.
  existingSecret: dune-backup-credentials
  bucket: dune-backups
  storage:
    class: ""
    size: 100Gi
  image:
    registry: docker.io
    version: "4.52"

world:
  title: Dyne Awakenyng
  stop: false
  # null preserves the game image default; true/false explicitly enables/disables it.
  battlEyeEnabled: null
  # NoPVP (PvE), Limited (normal PvP zones), or FullPVP (PvP everywhere).
  pvpMode: Limited
  # Player passwords are read from server-login-password in credentials.existingSecret.

  # Gameplay changes require a battlegroup restart. Multipliers retain upstream defaults.
  gameplay:
    # Gathering: 0.1–10. Applied to hand and vehicle mining and custom settings.
    gatheringMultiplier: 1
    # XP: 0–10; zero disables the corresponding gain.
    xpMultiplier: 1
    combatXpMultiplier: 1
    gatheringXpMultiplier: 1
    missionXpMultiplier: 1
    # Time: 0–5; costs: 0–10. Zero means instant crafting or no cost.
    craftingTimeMultiplier: 1
    craftingCostMultiplier: 1
    buildingCostMultiplier: 1
    # Capacity and respawn speed: 0.1–10.
    inventoryVolumeMultiplier: 1
    # Higher loot values make loot respawn slower; higher resource values respawn faster.
    lootRespawnSpeed: 1
    resourceRespawnSpeed: 1
    # All, Backpack, Default, or None. Quote "None" when using a values file.
    equipmentDropOnDeath: Default
    sandwormDeathPenalty: All
    # DependsOnSecurityZone, NeverAllowOtherPlayers, or AlwaysAllowOtherPlayers.
    playerDeathLootRule: DependsOnSecurityZone
    # Durability: 0–10; zero disables durability damage/drain.
    itemDurabilityDrainMultiplier: 1
    maxDurabilityLossEnabled: true
    vehicleDurabilityDamageMultiplier: 1
    sandwormsEnabled: true
    # Controls ordinary storms and their treasure, independently of Coriolis storms.
    sandstormsEnabled: true
    coriolisStormsEnabled: true
    # Building pieces: 0.1–10; maxBases: 0–10, or null to keep the image default.
    buildingPieceLimitMultiplier: 1
    maxBases: null
    infiniteBuildingStability: false
    dynamicBuildingDamageEnabled: true
    # Survival: 0–10; zero disables thirst/heat buildup.
    thirstMultiplier: 1
    heatBuildupMultiplier: 1

    # Additional settings from the shipped UserServerCustomSettings.ini.
    # Water extraction time; higher takes longer. Range: 0.1–10.
    waterExtractionRate: 1
    # Fuel burn multiplier; zero removes fuel burn. Range: 0–10.
    fuelBurnTimeMultiplier: 1
    # Player damage to players. Range: 0.1–10.
    playerDamageToPlayer: 1
    # Player damage to NPCs. Range: 0.1–10.
    playerDamageToNPC: 1
    # Player damage to vehicles. Range: 0.1–10.
    playerDamageToVehicle: 1
    # NPC health. Range: 0.1–10.
    npcHealth: 1
    # NPC damage to players. Range: 0.1–10.
    npcDamageToPlayer: 1
    # NPC damage to NPCs. Range: 0.1–10.
    npcDamageToNPC: 1
    # NPC respawn speed; higher respawns sooner. Range: 0.1–10.
    npcRespawnMultiplier: 1
    # Player damage to unshielded bases; zero disables it. Range: 0–10.
    pvpDamageStructures: 1
    # Stamina drain; higher drains faster. Range: 0.1–10.
    playerStaminaDrain: 1
    # Intel Point gain; zero disables it. Range: 0–10.
    intelPointsGainMultiplier: 1
    # Player shield absorption; higher lasts longer. Range: 0.1–10.
    playerShieldDamageAbsorptionMultiplier: 1
    # NPC shield absorption; higher lasts longer. Range: 0.1–10.
    npcShieldDamageAbsorptionMultiplier: 1
    # Landsraad contribution gain. Range: 0–10.
    landsraadContributionMultiplier: 1
    # Landsraad specialization XP gain. Range: 0–10.
    landsraadSpecializationXpMultiplier: 1
    # Landsraad faction standing changes. Range: 0–10.
    landsraadFactionStandingMultiplier: 1
    # Enforce no-build zones (upstream default).
    buildingRestrictionsEnabled: true

  # Tax settings from the shipped game image. Restart the battlegroup after changes.
  taxation:
    # Master tax switch; upstream disables taxes by default.
    enabled: false
    # Billing cycle in seconds: 1209600 = 14 days. Must be positive.
    cycleLengthSeconds: 1209600
    # Base hourly rates before landclaim/vertical-extension scaling (nonnegative).
    # Both keys exist upstream; which rate is used depends on the game's tax logic.
    paymentItemPerHour: 11.905
    spicePerHour: 11.90475
    # Ordered multiplier tables from upstream, starting with index 0.
    # Each list replaces the entire inherited INI array, rather than appending to it.
    # Entries scale costs by landclaim/vertical-extension count respectively.
    # Keep enough entries for the counts you allow; out-of-range behavior is unverified.
    costMultiplierPerLandclaim: [0, 0.5, 1, 1.5, 2, 2.5]
    costMultiplierPerVerticalExtension: [0, 0.5, 1, 1.5, 2, 2.5]

  # Optional CPU/memory requests and limits, keyed by an existing map name.
  # Partial overrides retain that map's original memory limit.
  # Example:
  # mapResources:
  #   Survival_1:
  #     requests: {cpu: "1", memory: 8Gi}
  #     limits: {cpu: "4", memory: 16Gi}
  mapResources: {}
