    name: v1
    schema:
      openAPIV3Schema:
        description: DatabaseRestore is the Schema for the DatabaseRestore API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.

              Servers should convert recognized schemas to the latest internal value, and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.

              Servers may infer this from the endpoint the client submits requests to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseRestoreSpec defines the details of a physical database backup restoration.
            properties:
              backup:
                description: 'Backup defines the identifier or name of the backup to be restored.

                  Corresponds to [DatabaseBackupStatus.Identifier].'
                type: string
              battleGroup:
                description: BattleGroup defines the unqiue identifier of the battlegroup whose database should
                  be targeted.
                pattern: '[a-z0-9]([-a-z0-9]*[a-z0-9])?'
                type: string
              originator:
                description: Originator defines the source of the restoration request.
                type: string
              targetTime:
                description: 'TargetTime defines the optional point in time at which to stop recovery.

                  Needs to be after the time of the base backup for Postgres to accept it.'
                type: string
            required:
            - backup
            - battleGroup
            type: object
          status:
            description: DatabaseRestoreStatus defines the observed status of a physical database backup restoration.
            properties:
              duration:
                description: Duration contains the duration between [StartTime] and [FinishTime] for easy access
                  and display as a printcolumn.
                type: string
              finishTime:
                description: FinishTime contains the time at which the restoration pod completed.
                format: date-time
                type: string
              phase:
                description: Phase contains the restorations current processing phase.
                enum:
                - Preparing
                - Pending
                - Starting
                - Ongoing
                - Cleanup
                - Succeeded
                - Finishing
                - Failed
                type: string
              startTime:
