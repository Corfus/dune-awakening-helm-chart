              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseMigrateSpec defines the details of a database migration to a different node.
            properties:
              backup:
                description: 'Backup defines the identifier or name of the backup to be restored after migration.

                  Corresponds to [DatabaseBackupStatus.Identifier].'
                type: string
              battleGroup:
                description: BattleGroup defines the unqiue identifier of the battlegroup whose database should
                  be targeted.
                pattern: '[a-z0-9]([-a-z0-9]*[a-z0-9])?'
                type: string
              originator:
                description: Originator defines the source of the migration request.
                type: string
              targetTime:
                description: 'TargetTime defines the optional point in time at which to stop recovery after migration.

                  Needs to be after the time of the base backup for Postgres to accept it.'
