metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
    controller-gen.kubebuilder.io/version: v0.18.0
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
  name: cachedfileoverlays.igw.funcom.com
spec:
  group: igw.funcom.com
  names:
    kind: CachedFileOverlay
    listKind: CachedFileOverlayList
    plural: cachedfileoverlays
    shortNames:
    - igwcfo
    singular: cachedfileoverlay
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.progress
      name: Progress
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .metadata.annotations.cfo\.igw\.funcom\.com\/applied
      name: Applied
      type: string
    - jsonPath: .metadata.annotations.cfo\.igw\.funcom\.com\/applied-timestamp
      name: AppliedTime
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: CachedFileOverlay is the Schema for the cachedfileoverlays API.
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.

              Servers should convert recognized schemas to the latest internal value, and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.

              Servers may infer this from the endpoint the client submits requests to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: CachedFileOverlaySpec a configuration file overlay need to be cached from a storage.
            properties:
              checksum:
                description: 'Checksum a CachedFileOverlay file checksum.

                  When Compression is nil Checksum should be calculated for a single source file.

                  For non nil Compression should be calculated for all the packed files,

                  not a Checksum of packed file itself.

                  Empty Checksum will skip checksum validation.'
                type: string
              compression:
                description: 'Compression describes file compression to unpack source file on a node.

                  nil compression will store source file on a node as it is without unpacking.

                  Possible values:

                  - ''zip'' : enable zip unpacking'
                type: string
              source:
                description: Source a name of overlay in the storage.
                type: string
            required:
            - source
            type: object
          status:
            default:
              nodes: {}
              phase: Created
            description: CachedFileOverlayStatus a status of file caching.
            properties:
              files:
                description: Files a list of files with relative path for the packed FileOverlay.
                items:
                  type: string
                type: array
              nodes:
                additionalProperties:
                  type: string
                default: {}
                description: Nodes the map of nodes already synchronized CachedFileOverlay.
                type: object
              nodesStatusMessages:
                additionalProperties:
                  type: string
                default: {}
                description: 'NodesStatusMessages contains messages provided by nodes during synchronization.

                  Can contain some error messages coming from nodes.'
                type: object
              phase:
                default: Created
                description: Phase the CachedFileOverlay synchronization phase.
                enum:
                - Created
                - InProgress
                - Completed
                - Failed
                type: string
              progress:
                description: Progress indicates the number of nodes synchronized overlay to total number of nodes
                  should be synchronized.
