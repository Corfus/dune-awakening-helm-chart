          kind:
            description: 'Kind is a string value representing the REST resource this object represents.

              Servers may infer this from the endpoint the client submits requests to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseBackupScheduleSpec defines the details of a physical database backup schedule.
            properties:
              battleGroup:
                description: BattleGroup defines the unqiue identifier of the battlegroup whose database should
                  be targeted.
                pattern: '[a-z0-9]([-a-z0-9]*[a-z0-9])?'
                type: string
              history:
                description: History defines the history configuration of the schedule.
                properties:
                  limits:
                    description: Limits defines the amount of recent backups to keep alive before deleting the oldest.
                    properties:
