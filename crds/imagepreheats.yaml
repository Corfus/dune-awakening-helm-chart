apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
    controller-gen.kubebuilder.io/version: v0.18.0
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
  name: imagepreheats.igw.funcom.com
spec:
  group: igw.funcom.com
  names:
    kind: ImagePreheat
    listKind: ImagePreheatList
    plural: imagepreheats
    shortNames:
    - igwiph
    singular: imagepreheat
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.progress
      name: Progress
      type: string
    - jsonPath: .status.failed
      name: Failed
      type: string
    - jsonPath: .status.duration
      name: Duration
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ImagePreheat is the Schema for the imagepreheats API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.

              Servers should convert recognized schemas to the latest internal value, and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.

              Servers may infer this from the endpoint the client submits requests to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: ImagePreheatSpec defines the desired state of a container image preheat.
            properties:
              image:
                description: Image defines the fully qualified name and tag of the image to preheat.
                pattern: ^.*:[a-zA-Z0-9_\.-]+$
                type: string
              nodeSelector:
                description: NodeSelector defines the labels with which to determine the nodes to preheat the target
                  image for.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements. The requirements are
                      ANDed.
                    items:
                      description: 'A label selector requirement is a selector that contains values, a key, and
                        an operator that

                        relates the key and values.'
                      properties:
                        key:
                          description: key is the label key that the selector applies to.
                          type: string
                        operator:
                          description: 'operator represents a key''s relationship to a set of values.

                            Valid operators are In, NotIn, Exists and DoesNotExist.'
                          type: string
                        values:
                          description: 'values is an array of string values. If the operator is In or NotIn,

                            the values array must be non-empty. If the operator is Exists or DoesNotExist,

                            the values array must be empty. This array is replaced during a strategic

                            merge patch.'
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: 'matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels

                      map is equivalent to an element of matchExpressions, whose key field is "key", the

                      operator is "In", and the values array contains only "value". The requirements are ANDed.'
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              podTemplate:
                description: PodTemplate defines optional settings to be set in the preheating pods.
                properties:
                  args:
                    description: Arguments defines the arguments provided to [Command] when running the preheated
                      image.
                    items:
                      type: string
                    type: array
                  command:
                    default:
                    - date
                    description: 'Command defines the command to run the preheated image with.

                      Should successfully terminate the pod as quickly as possible.'
                    items:
                      type: string
                    type: array
                  namespace:
                    default: default
                    description: Namespace defines the namespace to spawn preheating pods in.
                    type: string
                  tolerations:
                    description: Tolerations defines the taints to be tolerated.
                    items:
                      description: 'The pod this Toleration is attached to tolerates any taint that matches

                        the triple <key,value,effect> using the matching operator <operator>.'
                      properties:
                        effect:
                          description: 'Effect indicates the taint effect to match. Empty means match all taint
                            effects.

                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.'
                          type: string
                        key:
                          description: 'Key is the taint key that the toleration applies to. Empty means match all
                            taint keys.

                            If the key is empty, operator must be Exists; this combination means to match all values
                            and all keys.'
                          type: string
                        operator:
                          description: 'Operator represents a key''s relationship to the value.

                            Valid operators are Exists and Equal. Defaults to Equal.

                            Exists is equivalent to wildcard for value, so that a pod can

                            tolerate all taints of a particular category.'
                          type: string
                        tolerationSeconds:
                          description: 'TolerationSeconds represents the period of time the toleration (which must
                            be

                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,

                            it is not set, which means tolerate the taint forever (do not evict). Zero and

                            negative values will be treated as 0 (evict immediately) by the system.'
                          format: int64
                          type: integer
                        value:
                          description: 'Value is the taint value the toleration matches to.

                            If the operator is Exists, the value should be empty, otherwise just a regular string.'
                          type: string
                      type: object
                    type: array
                required:
                - command
                - namespace
                type: object
              scalingLimit:
                description: 'ScalingLimit defines the maximum amount of nodes to preheat the target image on.

                  If not specified, all matching nodes will be preheated.'
                type: integer
              scalingStep:
                description: ScalingStep determines the step size for Static and Incremental scaling strategies.
                type: integer
              scalingStrategy:
                default: Exponential
                description: ScalingStrategy defines the strategy to use for scaling up the amount of simultaneously
                  preheating nodes.
                enum:
                - Static
                - Incremental
                - Exponential
                - Fibonacci
                type: string
            required:
            - image
            - nodeSelector
            - scalingStrategy
            type: object
          status:
            description: ImagePreheatStatus defines the observed status of a container image preheat.
            properties:
              duration:
                description: Duration contains the duration between [StartTime] and [FinishTime] for easy access
                  and display as a printcolumn.
                type: string
              failed:
                description: Failed describes the number of nodes which failed to pull the image.
                type: integer
              finishTime:
                description: FinishTime contains the time at which all of the preheat's required pods completed.
                format: date-time
                type: string
              lastBatchSizes:
                description: BatchSizeReference contains the last batch sizes required for calculating future batches.
                items:
                  type: integer
                type: array
              phase:
                description: Phase describes the preheat's current reconciliation phase
                enum:
                - Pending
                - Ongoing
                - Cleanup
                - Completed
                type: string
              progress:
                description: Process describes the preheat progress in the form of `completed/total`.
                type: string
              startTime:
                description: StartTime contains the time at which the preheat entered its Ongoing phase marking
                  the beginning of preheating.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
