apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: battlegroupoperator-mutating
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/battlegroupoperator-webhook
webhooks:
- name: battlegroup.mutating.igw.funcom.com
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Equivalent
  timeoutSeconds: 10
  clientConfig:
    service:
      name: battlegroupoperator-webhook
      namespace: {{ .Release.Namespace | quote }}
      path: /mutate-igw-funcom-com-v1-battlegroup
  rules:
  - apiGroups:
    - igw.funcom.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - battlegroups
    scope: Namespaced
---
