apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: dune-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: dune-webhook-ca
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  isCA: true
  commonName: dune-webhook-ca
  secretName: dune-webhook-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: dune-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: dune-webhook-ca
  annotations:
    argocd.argoproj.io/sync-wave: '-19'
spec:
  ca:
    secretName: dune-webhook-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: battlegroupoperator-webhook
  annotations:
    argocd.argoproj.io/sync-wave: '-18'
spec:
  secretName: battlegroupoperator-webhook-server-cert
  dnsNames:
  - battlegroupoperator-webhook.{{ .Release.Namespace }}.svc
  - battlegroupoperator-webhook.{{ .Release.Namespace }}.svc.cluster.local
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: dune-webhook-ca
    kind: Issuer
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: battlegroupoperator-webhook
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  selector:
    control-plane: battlegroup-controller-manager
  ports:
  - name: https
    port: 443
    targetPort: webhook-server
---
