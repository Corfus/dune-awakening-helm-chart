{{- if .Values.backups.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dune-backups
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-10"
spec:
  accessModes: [ReadWriteOnce]
{{- if .Values.backups.storage.class }}
  storageClassName: {{ .Values.backups.storage.class | quote }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.backups.storage.size | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dune-backup-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    igw.funcom.com/backup-config: dune
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
type: Opaque
stringData:
  AWS_ENDPOINT_URL: {{ printf "http://dune-backups.%s.svc:8333" .Release.Namespace | quote }}
  AWS_DEFAULT_REGION: us-east-1
  BARMAN_CLOUD_BUCKET_NAME: {{ .Values.backups.bucket | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: dune-backups
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dune-backups
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dune-backups
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dune-backups
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dune-backups
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: s3
          image: {{ printf "%s/chrislusf/seaweedfs:%s" (trimSuffix "/" .Values.backups.image.registry) .Values.backups.image.version | quote }}
          command: [weed]
          args:
            - mini
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -webdav=false
            - -admin.ui=false
            - -master.telemetry=false
            - {{ printf "-bucket=%s" .Values.backups.bucket | quote }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.existingSecret | quote }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.existingSecret | quote }}
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - name: s3
              containerPort: 8333
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: s3
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: backups
              mountPath: /data
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: dune-backups
---
# Mini's internal APIs have no S3 authentication: expose only the S3 port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dune-backups
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dune-backups
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8333
{{- end }}
