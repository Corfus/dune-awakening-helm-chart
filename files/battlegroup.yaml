              auth_cache.cached_backend = http

              auth_http.http_method   = post
              auth_http.user_path     = http://$(RMQ_HTTP_AUTH_ADDRESS)/v0/auth/user
              auth_http.vhost_path    = http://$(RMQ_HTTP_AUTH_ADDRESS)/v0/auth/vhost
              auth_http.resource_path = http://$(RMQ_HTTP_AUTH_ADDRESS)/v0/auth/resource
              auth_http.topic_path    = http://$(RMQ_HTTP_AUTH_ADDRESS)/v0/auth/topic

              listeners.tcp = none

              listeners.ssl.default = 5672 # A list of ports to listen on for TLS connections. RabbitMQ can listen on a single interface or multiple ones.
              ssl_options.cacertfile = /etc/rabbitmq/cacert.pem # Certificate Authority (CA) bundle file path
              ssl_options.certfile = /etc/rabbitmq/cert.pem # Server certificate file path
              ssl_options.keyfile       = /etc/rabbitmq/key.pem # Server private key file path

              ssl_options.verify = verify_none # Do not request certificate from client

          envSecretSelectors:
          - matchLabels:
              igw.funcom.com/env-for-message-queue: default
