        global:
          userIniConfig:
            mountPath: /home/dune/server/DuneSandbox/Saved/UserSettings
            files:
              UserServerCustomSettings.ini: {{ tpl (.Files.Get "files/UserServerCustomSettings.ini") . | quote }}
              UserGame.ini: |-
                ; Settings in these config files will be applied to every server in the battlegroup
                ; If you need to override different settings for different servers, use the battlegroup editor instead

                [/Script/DuneSandbox.PvpPveSettings]
                ; Enable PVP for all partitions
                m_bShouldForceEnablePvpOnAllPartitions=False
                ; Enable PVP for specific partitions. Example:
                ;+m_PvpEnabledPartitions=1
                ;+m_PvpEnabledPartitions=2

                [/Script/DuneSandbox.SecurityZonesSubsystem]
                ; Disabling security zones across the board allows for PVP and ability usage everywhere
                m_bAreSecurityZonesEnabled=True

                [/DeteriorationSystem.ItemDeteriorationConstants]
                ; Deterioration rate for items | (0 to 10)  0=off
                UpdateRateInSeconds=1.0

                [/Script/DuneSandbox.SandStormConfig]
                ; Enable Coriolis storm
                m_bCoriolisAutoSpawnEnabled={{ ternary "True" "False" .Values.world.gameplay.coriolisStormsEnabled }}

                [/Script/DuneSandbox.TaxationSettings]
                ; Master switch. The shipped image disables taxation by default.
                m_bTaxationEnabled={{ ternary "True" "False" .Values.world.taxation.enabled }}
                ; Billing interval in seconds (1209600 = 14 days).
                m_TaxationCycleLengthSeconds={{ .Values.world.taxation.cycleLengthSeconds | int64 }}
                ; Base hourly rates before scaling; the game determines which rate applies.
                m_PaymentItemPerHour={{ .Values.world.taxation.paymentItemPerHour }}
                m_SpicePerHour={{ .Values.world.taxation.spicePerHour }}
                ; Replace inherited arrays. Ordered entries scale costs by count, from index 0.
                ; Repeated entries are intentional: Unreal's . operator preserves duplicates.
                !m_CostMultiplierPerLandclaim=ClearArray
{{ range .Values.world.taxation.costMultiplierPerLandclaim }}
                .m_CostMultiplierPerLandclaim={{ . }}
{{ end }}
                !m_CostMultiplierPerVerticalExtension=ClearArray
{{ range .Values.world.taxation.costMultiplierPerVerticalExtension }}
                .m_CostMultiplierPerVerticalExtension={{ . }}
{{ end }}

                [/Script/DuneSandbox.BuildingSettings]
                ; Max number of landclaim extension segments. !Needs to also be applied to each client!
                ; Also see complementary setting FiefdomLimit in UserServerCustomSettings.ini for increasing count of bases
                m_MaxNumLandclaimSegments=6
                ; Number of times a landclaim can be expanded
                m_BuildingBlueprintMaxExtensions=4
                m_BaseBackupMaxExtensions=8
                ; Enable building restriction limits !Needs to also be applied to each client!
                ; Set to False to remove caps on structure categories placed and global buildable limit
                ; Also see complementary bIsBuildingRestrictionsEnabled on UserServerCustomSettings.ini for building in restricted areas
                m_bBuildingRestrictionLimitsEnabled=True

                [/Script/DuneSandbox.SandwormSettings]
                ; Sandworm threat detections. The higher the value, the earlier the sandworm breaches and attacks.
                HarvestSpicePickupThreatUnit=10.000000
                HarvestSpiceCoalesceThreatUnit=10.000000
                HarvestFlourSandPickupThreatUnit=10.000000
                HarvestFlourSandCoalesceThreatUnit=10.000000
                WalkingThreatPerSec=15.000000
                CrouchingThreatPerSec=15.000000
                RunningThreatPerSec=20.000000
                SprintingThreatPerSec=20.000000
                HyperSprintingThreatPerSec=90.000000
                DashingThreatPerSec=90.000000
                SuspendingThreatPerSec=200.000000
                DrumsandThreatPerSec=200.000000
                ShieldingThreatPerSec=500.000000
              UserEngine.ini: {{ tpl (.Files.Get "files/UserEngine.ini") . | quote }}
